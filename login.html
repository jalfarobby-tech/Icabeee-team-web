<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Masuk — ICABEEE TEAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F5F2; --ink:#17171A; --ink-soft:#6E6E76; --ink-faint:#A9A8A2;
    --line:#E4E2DC; --line-strong:#D3D0C8;
    --accent:#D2491F; --accent-soft:#FBEAE0;
    --good:#2F8F5B; --good-soft:#E7F3EC;
    --bad:#C23B2E; --bad-soft:#FBEAE8;
    --df:'Sora',sans-serif; --di:'Inter',sans-serif;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:var(--di); color:var(--ink); background:var(--paper);
    display:flex; align-items:center; justify-content:center; padding:24px;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{ width:100%; max-width:368px; opacity:0; transform:translateY(6px); animation:riseIn .6s var(--ease) forwards; }
  @keyframes riseIn{ to{ opacity:1; transform:translateY(0); } }

  /* ═══ wordmark ═══ */
  .brand{ display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
  .wordmark{ font-family:var(--df); font-weight:800; font-size:1.2rem; letter-spacing:.02em; }
  .team-label{
    text-align:center; font-size:.68rem; font-weight:600; letter-spacing:.22em;
    color:var(--ink-faint); text-transform:uppercase; margin-bottom:40px;
  }

  .heading{ font-family:var(--df); font-weight:700; font-size:1.3rem; text-align:center; margin-bottom:6px; }
  .sub{ text-align:center; color:var(--ink-soft); font-size:.86rem; margin-bottom:30px; transition:color .3s; }
  .sub.error{ color:var(--bad); }
  .sub.success{ color:var(--good); }

  /* ═══ panel switching ═══ */
  .panel{ display:none; }
  .panel.show{ display:block; animation:panelIn .32s var(--ease); }
  .panel.leaving{ animation:panelOut .18s var(--ease) forwards; }
  @keyframes panelIn{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes panelOut{ to{ opacity:0; transform:translateY(-4px); } }

  /* ═══ form, gaya garis-bawah polos (bukan kotak bervolume) ═══ */
  .field{ margin-bottom:20px; }
  .field label{
    display:block; font-size:.74rem; font-weight:600; color:var(--ink-soft);
    margin-bottom:7px; letter-spacing:.01em;
  }
  .field input{
    width:100%; border:none; border-bottom:1.5px solid var(--line-strong); background:transparent;
    padding:8px 2px; font-family:var(--di); font-size:.95rem; color:var(--ink);
    outline:none; transition:border-color .25s var(--ease);
  }
  .field input::placeholder{ color:var(--ink-faint); }
  .field input:focus{ border-bottom-color:var(--accent); }

  .field-foot{ display:flex; justify-content:flex-end; margin:-8px 0 22px; }
  .link-btn{
    background:none; border:none; padding:0; font-family:var(--di); font-size:.78rem;
    color:var(--ink-soft); cursor:pointer; transition:color .2s;
  }
  .link-btn:hover{ color:var(--accent); }

  button.submit{
    width:100%; border:none; border-radius:10px; padding:13px; cursor:pointer;
    font-family:var(--di); font-weight:600; font-size:.92rem; color:#fff;
    background:var(--ink); position:relative; overflow:hidden;
    transition:background .25s var(--ease), transform .15s var(--ease);
  }
  button.submit:hover{ background:#000; }
  button.submit:active{ transform:scale(.985); }
  button.submit:disabled{ cursor:default; }
  button.submit.success{ background:var(--good); }

  .btn-label{ display:inline-block; transition:opacity .16s; }
  .btn-label.swap{ opacity:0; }
  .btn-spinner{
    position:absolute; left:50%; top:50%; margin:-9px 0 0 -9px; width:18px; height:18px;
    opacity:0; transition:opacity .18s;
    border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%;
  }
  button.submit.loading .btn-label{ opacity:0; }
  button.submit.loading .btn-spinner{ opacity:1; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .err{
    display:none; background:var(--bad-soft); color:var(--bad); font-size:.8rem;
    border-radius:8px; padding:10px 12px; margin-bottom:18px;
  }
  .err.show{ display:block; animation:errIn .3s var(--ease); }
  @keyframes errIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }

  .info-box{
    background:var(--line); color:var(--ink-soft); font-size:.82rem; line-height:1.5;
    border-radius:8px; padding:12px 14px; margin-bottom:20px; display:none;
  }
  .info-box.show{ display:block; }
  .info-box.success-box{ background:var(--good-soft); color:var(--good); }

  .back-row{
    display:flex; align-items:center; gap:6px; font-size:.82rem; color:var(--ink-soft);
    cursor:pointer; margin-bottom:20px; width:fit-content; transition:color .2s;
  }
  .back-row:hover{ color:var(--ink); }
  .back-row svg{ width:16px; height:16px; }

  .ghost-btn{
    width:100%; margin-top:12px; background:none; border:none; padding:8px;
    font-family:var(--di); font-size:.82rem; color:var(--ink-soft); cursor:pointer; transition:color .2s;
  }
  .ghost-btn:hover{ color:var(--ink); }

  /* ═══ loader ═══ */
  .loader-wrap{ flex-direction:column; align-items:center; padding:20px 0; }
  /* FIX: dulu .loader-wrap punya display:flex sendiri yang bentrok sama .panel{display:none}
     — karena spesifisitasnya sama-sama 1 class, yang belakangan di file ini menang, jadinya
     loader ini KELIHATAN TERUS dari awal buka halaman, gak peduli lagi loading apa enggak.
     Sekarang pakai selector ID (#loader) yang spesifisitasnya lebih tinggi, jadi PASTI nurut
     ke .panel.show — cuma kelihatan pas beneran lagi proses. */
  #loader.show{ display:flex; }
  .spinner{
    width:26px; height:26px; border:2.5px solid var(--line-strong); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite; margin-bottom:14px;
  }
  .loader-wrap p{ color:var(--ink-soft); font-size:.85rem; }

  /* ═══ sukses ═══ */



  .field-icon-input{ position:relative; }
  .field-icon-input svg{
    position:absolute; left:0; bottom:11px; width:15px; height:15px; color:var(--ink-faint);
    pointer-events:none;
  }
  .field-icon-input input{ padding-left:23px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="wordmark">ICABEEE</span></div>
    <div class="team-label">Team</div>

    <div class="heading" id="headingText">Masuk ke dashboard</div>
    <div class="sub" id="subText"></div>

    <div class="err" id="errBox"></div>

    <!-- ═══ Form login ═══ -->
    <div class="panel show" id="loginPanel">
      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <div class="field-icon-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 6 8 6 8-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
            <input type="email" id="email" required autocomplete="username" placeholder="nama@email.com">
          </div>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="field-icon-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
          </div>
        </div>
        <div class="field-foot">
          <button type="button" class="link-btn" id="forgotLinkBtn">Lupa password?</button>
        </div>
        <button type="submit" class="submit" id="loginBtn">
          <span class="btn-label" id="loginBtnLabel">Masuk</span>
          <span class="btn-spinner"></span>
        </button>
      </form>
    </div>

    <!-- ═══ Panel lupa password ═══ -->
    <div class="panel" id="forgotPanel">
      <div class="back-row" id="backToLoginBtn" tabindex="0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        Kembali ke login
      </div>
      <div class="info-box" id="forgotInfoBox">
        Masukin email akun kamu. Kalau terdaftar, link buat bikin password baru bakal dikirim ke email itu.
      </div>
      <form id="forgotForm">
        <div class="field" style="margin-bottom:14px;">
          <label for="forgotEmail">Email</label>
          <div class="field-icon-input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 6 8 6 8-6"/><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
            <input type="email" id="forgotEmail" required autocomplete="username" placeholder="nama@email.com">
          </div>
        </div>
        <button type="submit" class="submit" id="forgotBtn">Kirim link reset</button>
      </form>
      <button type="button" class="ghost-btn" id="backToLoginBtn2">Kembali ke login</button>
    </div>

    <!-- ═══ Loader ═══ -->
    <div class="loader-wrap panel" id="loader">
      <div class="spinner"></div>
      <p>Memuat akun kamu…</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { initializeAppCheck, ReCaptchaV3Provider } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app-check.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB2Fczb4wGbF9ah0mQuuZi8WWaim_hQB4M",
      authDomain: "icabeee-team-app.firebaseapp.com",
      projectId: "icabeee-team-app",
      storageBucket: "icabeee-team-app.firebasestorage.app",
      messagingSenderId: "71257065015",
      appId: "1:71257065015:web:783a2515d48763aec361b2"
    };

    const app = initializeApp(firebaseConfig);
    // App Check — mastiin cuma halaman web asli kalian yang boleh manggil Firestore/Auth,
    // bukan bot/script dari luar. reCAPTCHA v3 jalan di background, gak ganggu user sama sekali.
    initializeAppCheck(app, {
      provider: new ReCaptchaV3Provider('6Lfgx2ItAAAAAAC-tcS5Kp0wSN4Daw53pltMqvx1'),
      isTokenAutoRefreshEnabled: true
    });
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById('loginForm');
    const errBox = document.getElementById('errBox');
    const loginBtn = document.getElementById('loginBtn');
    const loginBtnLabel = document.getElementById('loginBtnLabel');
    const loader = document.getElementById('loader');
    const loginPanel = document.getElementById('loginPanel');
    const subText = document.getElementById('subText');

    // ── ganti kartu/panel dengan transisi halus (fade + geser dikit) ──
    function activePanel() {
      return document.querySelector('#loginPanel.show, #forgotPanel.show, #loader.show');
    }
    function switchPanel(fromEl, toEl) {
      if (fromEl === toEl) return;
      if (fromEl) {
        fromEl.classList.add('leaving');
        setTimeout(() => { fromEl.classList.remove('show', 'leaving'); }, 200);
      }
      setTimeout(() => { toEl.classList.add('show'); }, fromEl ? 190 : 0);
    }

    // ── ganti teks tombol dengan crossfade halus, gak loncat tiba-tiba ──
    function setBtnLabel(text) {
      loginBtnLabel.classList.add('swap');
      setTimeout(() => {
        loginBtnLabel.textContent = text;
        loginBtnLabel.classList.remove('swap');
      }, 160);
    }

    function showError(msg) {
      errBox.textContent = msg;
      errBox.classList.remove('show'); void errBox.offsetWidth; errBox.classList.add('show');
      subText.textContent = 'Ada yang salah, coba lagi.';
      subText.className = 'sub error';
      flagError();
    }

    // Feedback visual sekarang cukup lewat titik "live" di wordmark — gak ada
    // lagi badge/maskot yang gonta-ganti ekspresi. Sengaja dibikin minim.
    function flagError() {
      document.body.classList.remove('state-success');
      document.body.classList.add('state-error');
      setTimeout(() => {
        document.body.classList.remove('state-error');
        subText.textContent = '';
        subText.className = 'sub';
      }, 2800);
    }

    function flagSuccess() {
      document.body.classList.add('state-success');
      loginBtn.classList.add('success');
    }

    async function redirectByRole(uid) {
      const snap = await getDoc(doc(db, 'users', uid));
      if (!snap.exists()) {
        showError('Akun kamu belum terdaftar di sistem. Hubungi owner.');
        switchPanel(activePanel(), loginPanel);
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        setBtnLabel('Masuk');
        return;
      }
      flagSuccess();
      loginBtn.classList.remove('loading');
      loginBtn.classList.add('success');
      setBtnLabel('Berhasil masuk!');
      setTimeout(() => {
        window.location.href = snap.data().role === 'owner' ? 'dashboard-owner.html' : 'dashboard-karyawan.html';
      }, 900);
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        switchPanel(loginPanel, loader);
        redirectByRole(user.uid);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.classList.remove('success');
      loginBtn.classList.add('loading');
      setBtnLabel('Memproses…');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await redirectByRole(cred.user.uid);
      } catch (err) {
        let msg = 'Email atau password salah.';
        if (err.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan. Coba lagi nanti.';
        if (err.code === 'auth/user-disabled') msg = 'Akun ini dinonaktifkan.';
        showError(msg);
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
        setBtnLabel('Masuk');
      }
    });

    // ── lupa password ──
    const loginPanelEl = document.getElementById('loginPanel');
    const forgotPanel = document.getElementById('forgotPanel');
    const forgotForm = document.getElementById('forgotForm');
    const forgotBtn = document.getElementById('forgotBtn');
    const forgotInfoBox = document.getElementById('forgotInfoBox');
    const headingText = document.getElementById('headingText');

    function openForgotPanel() {
      errBox.classList.remove('show');
      loginPanelEl.classList.remove('show');
      forgotPanel.classList.add('show');
      forgotInfoBox.className = 'info-box show';
      forgotInfoBox.textContent = 'Masukin email akun kamu. Kalau terdaftar, link buat bikin password baru bakal dikirim ke email itu.';
      document.getElementById('forgotEmail').value = document.getElementById('email').value.trim();
      headingText.textContent = 'Reset password';
      subText.textContent = 'Kami kirim link resetnya ke email kamu';
      subText.className = 'sub';
    }
    function closeForgotPanel() {
      forgotPanel.classList.remove('show');
      loginPanelEl.classList.add('show');
      headingText.textContent = 'Masuk ke dashboard';
      subText.textContent = '';
      subText.className = 'sub';
      forgotForm.style.display = 'block';
    }
    document.getElementById('forgotLinkBtn').addEventListener('click', openForgotPanel);
    document.getElementById('backToLoginBtn').addEventListener('click', closeForgotPanel);
    document.getElementById('backToLoginBtn2').addEventListener('click', closeForgotPanel);

    forgotForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      forgotBtn.disabled = true;
      forgotBtn.textContent = 'Mengirim…';
      const email = document.getElementById('forgotEmail').value.trim();
      try {
        await sendPasswordResetEmail(auth, email);
        forgotInfoBox.className = 'info-box success-box show';
        forgotInfoBox.textContent = `Link reset password sudah dikirim ke ${email}. Cek inbox (atau folder spam) ya, lalu buka linknya buat bikin password baru.`;
        forgotForm.style.display = 'none';
      } catch (err) {
        // Demi keamanan, jangan bocorin apakah emailnya kedaftar atau nggak.
        forgotInfoBox.className = 'info-box success-box show';
        forgotInfoBox.textContent = `Kalau ${email} terdaftar di sistem, link reset password sudah dikirim. Cek inbox (atau folder spam) ya.`;
        forgotForm.style.display = 'none';
      }
      forgotBtn.disabled = false;
      forgotBtn.textContent = 'Kirim link reset';
    });
  </script>
</body>
</html>
